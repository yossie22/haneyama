<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>万年山VR</title>
<meta name="viewport" content="target-densitydpi=device-dpi, width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, minimal-ui" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<link rel="icon" href="vr-icon.ico" type="image/x-icon">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
#pano { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

/* 十字キー（測定用：白） */
#crosshair {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: 30px; height: 30px; pointer-events: none; z-index: 100; opacity: 0; transition: opacity 0.5s ease;
}
#crosshair.visible { opacity: 0.6; }
#crosshair::before, #crosshair::after { content: ''; position: absolute; background: white; }
#crosshair::before { top: 14px; left: 0; width: 30px; height: 2px; }
#crosshair::after { left: 14px; top: 0; width: 2px; height: 30px; }

#compassContainer {
  position: absolute; top: 20px; right: 20px; display: flex; align-items: center; z-index: 100;
  transition: opacity 0.5s ease; opacity: 0; pointer-events: none;
}
#compassContainer.visible { opacity: 1; pointer-events: auto; }

/* 方位計（数値：全シーン共通） */
#degreeCircle {
  width: 60px; height: 60px; background: rgba(255,255,255,0.8); border-radius: 50%; border: 3px solid #0066ff;
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  font-family: sans-serif; font-weight: bold; font-size: 14px; color: #0066ff;
  z-index: 102;
}
#degreeCircle small { font-size: 10px; color: #666; }

/* コンパス（針：データがある時のみ） */
#compassCircle {
  width: 60px; height: 60px; background: white; border-radius: 50%; border: 3px solid #0066ff;
  margin-left: 10px; display: none; justify-content: center; align-items: center; box-shadow: 0 4px 8px rgba(0,0,0,0.3);
}
#compassCircle.active { display: flex; }

#volumeContainer {
  position: absolute; top: 20px; left: 20px; height: 60px; display: flex; align-items: center;
  background: rgba(54, 40, 34, 0.85); padding: 0 20px; border-radius: 30px;
  z-index: 100; transition: opacity 0.5s ease; opacity: 0; border: 1px solid rgba(255,255,255,0.2);
  pointer-events: none;
}
#volumeContainer.visible { opacity: 0.8; pointer-events: auto; }
#volumeLabel { color: #FF8C00; font-weight: bold; font-family: sans-serif; margin-right: 12px; font-size: 18px; }
#volumeSlider { cursor: pointer; width: 100px; height: 8px; accent-color: #00FF00; }
.auto-ctrl{position:absolute;left:20px;height:46px;display:flex;align-items:center;padding:0 14px;border-radius:23px;z-index:100;transition:opacity 0.5s ease;opacity:0;pointer-events:none;}
.auto-ctrl.visible{opacity:0.9;pointer-events:auto;}
#speedContainer{top:90px;background:rgba(10,30,55,0.88);border:1px solid rgba(80,160,255,0.4);}
#zoomContainer{top:144px;background:rgba(10,45,25,0.88);border:1px solid rgba(80,200,100,0.4);}
#fadeContainer{top:198px;background:rgba(55,20,40,0.88);border:1px solid rgba(255,100,160,0.4);}
.ctrl-label{font-weight:bold;font-family:sans-serif;font-size:14px;margin-right:8px;white-space:nowrap;}
#speedContainer .ctrl-label{color:#66ccff;}#zoomContainer .ctrl-label{color:#88ee88;}#fadeContainer .ctrl-label{color:#ffaacc;}
.ctrl-slider{cursor:pointer;width:80px;height:8px;}
#speedSlider{accent-color:#66ccff;}#zoomSlider{accent-color:#88ee88;}#fadeSlider{accent-color:#ffaacc;}
.ctrl-val{font-family:sans-serif;font-size:12px;margin-left:7px;min-width:38px;}
#speedVal{color:#aaddff;}#zoomVal{color:#aaffaa;}#fadeVal{color:#ffccdd;}

#mapButton { position: absolute; bottom: 30px; left: 20px; width: 70px; height: 70px; cursor: pointer; z-index: 100; opacity: 0; transition: opacity 0.5s ease; pointer-events: none; }
#mapButton.visible { opacity: 0.7; pointer-events: auto; }
#counter { position: absolute; bottom: 30px; left: 110px; width: 60px; height: 60px; background: white; border: 3px solid #ff0000; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 24px; font-weight: bold; color: #0066ff; z-index: 100; opacity: 0; transition: opacity 0.5s ease; pointer-events: none; user-select: none; }
#counter.visible { opacity: 0.7; pointer-events: auto; }

.arrow-nav { position: absolute; width: 60px; height: 60px; cursor: pointer; z-index: 100; opacity: 0; transition: opacity 0.5s ease; pointer-events: none; }
.arrow-nav.visible { opacity: 0.8; pointer-events: auto; }
.arrow-nav.arrow-blink.visible { animation: yellowArrowBlink 1.7s ease-in-out infinite; }
@keyframes yellowArrowBlink {
  0%, 100% { opacity: 0.18; filter: drop-shadow(0 0 3px rgba(255, 255, 0, 0.35)); }
  50% { opacity: 0.55; filter: drop-shadow(0 0 6px rgba(255, 255, 0, 0.55)); }
}
#arrowUp { bottom: 160px; right: 120px; }
#arrowDown { bottom: 50px; right: 120px; }
#arrowLeft { bottom: 105px; right: 185px; }
#arrowRight { bottom: 105px; right: 55px; }
/* 緑・青は廃止（DOM は残すが常に非表示） */
#arrowUpGreen, #arrowDownGreen, #arrowBlueLeft, #arrowBlueRight {
  display: none !important;
  visibility: hidden !important;
  pointer-events: none !important;
}

/* 53-cc001 フェードイン用オーバーレイ（白系） */
#fadeOverlay {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(255, 255, 255, 0.8); z-index: 1000; opacity: 0;
  pointer-events: none; transition: opacity 2s ease-out;
}

/* ===== infoHotspot テキストオーバーレイ ===== */
#sceneText {
  position: fixed;
  z-index: 200;
  display: block;
  box-sizing: border-box;
  /* スマホ実機：data.js の px × 1.6（2月仕様）。PCプレビューは 文字入力 で px そのまま */
  width: 88vw;
  max-width: min(88vw, 42em);
  padding: 4px 10px;
  background: none;
  pointer-events: none;
  text-align: left;
  transform: translateX(-50%);
  white-space: pre-wrap;
  word-wrap: break-word;
  overflow-wrap: break-word;
  word-break: normal;
  line-height: 1.4;
  /* 多重シャドウで背景に溶け込む */
  text-shadow:
    0   0   2px  rgba(0,0,0,1),
    0   0   5px  rgba(0,0,0,1),
    0   0   10px rgba(0,0,0,0.85),
    1px  1px 1px rgba(0,0,0,1),
    -1px 1px 1px rgba(0,0,0,1),
    1px -1px 1px rgba(0,0,0,1),
    -1px -1px 1px rgba(0,0,0,1);
  opacity: 1;
  transition: opacity 1s ease;
}

/* 扉演出用：部分ぼかし（中心→外側へグラデーション） */
#blurOverlay {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  z-index: 1001;
  opacity: 0;
  pointer-events: none;

  /* ぼかし強度（JSで更新） */
  -webkit-backdrop-filter: blur(var(--blurPx, 14px));
  backdrop-filter: blur(var(--blurPx, 14px));

  /* クリック位置を中心に、内側ほど強く・外側ほど透明（=くっきり） */
  -webkit-mask-image: radial-gradient(circle at var(--bx, 50%) var(--by, 50%),
    rgba(0,0,0,1) 0px,
    rgba(0,0,0,1) var(--innerR, 120px),
    rgba(0,0,0,0) var(--outerR, 260px)
  );
  mask-image: radial-gradient(circle at var(--bx, 50%) var(--by, 50%),
    rgba(0,0,0,1) 0px,
    rgba(0,0,0,1) var(--innerR, 120px),
    rgba(0,0,0,0) var(--outerR, 260px)
  );
}

.portal-hotspot {
  position: relative;
  cursor: pointer;
  opacity: 0;
  pointer-events: none;
  overflow: visible;
}
.portal-hotspot img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
/* タップ判定：中央の円（広すぎ→22%に縮小済み → やや拡大 34%/40%） */
.portal-hit-area {
  position: absolute;
  left: 33%;
  top: 33%;
  width: 34%;
  height: 34%;
  border-radius: 50%;
  z-index: 2;
  cursor: pointer;
  pointer-events: none;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.portal-hotspot.portal-tappable {
  pointer-events: none;
}
.portal-hotspot.portal-tappable .portal-hit-area {
  pointer-events: auto;
}
@media (pointer: coarse) {
  .portal-hit-area {
    left: 30%;
    top: 30%;
    width: 40%;
    height: 40%;
  }
}
.portal-inner {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  transform-origin: 50% 50%;
  transition-property: transform;
  transition-timing-function: ease-in-out;
  will-change: transform;
}
.portal-reveal-cover {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background-image: url("start.png");
  background-size: 100% 100%;
  background-position: center;
  background-repeat: no-repeat;
  transition-property: opacity;
  transition-timing-function: ease-in-out;
  pointer-events: none;
  transform: scale(1.1);
  transform-origin: 50% 50%;
}

/* 2D動画ホットスポット（ガイド人物・パノラマ上） */
.scene-video-2d-wrap {
  overflow: hidden;
  cursor: pointer;
  pointer-events: auto;
  opacity: 1;
  box-sizing: border-box;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transform: translateZ(1px);
  backface-visibility: hidden;
  position: relative;
  background: transparent;
  border: none;
  outline: none;
  box-shadow: none;
}
.scene-video-mask {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  pointer-events: none;
}
.scene-video-2d-wrap video {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center center;
  background: transparent;
  opacity: 1;
  vertical-align: top;
}
.scene-video-mask.guide-matte-lighten {
  mix-blend-mode: lighten;
}
/* iPad/Safari: ホットスポット全体で lighten（PCと同じ見え方） */
.scene-video-2d-wrap.guide-ios-visible {
  isolation: isolate;
  mix-blend-mode: lighten;
  -webkit-transform: translateZ(2px);
  transform: translateZ(2px);
  z-index: 2;
}
.scene-video-2d-wrap.guide-ios-visible .scene-video-mask {
  mix-blend-mode: lighten;
  -webkit-transform: translateZ(1px);
  transform: translateZ(1px);
}
.scene-video-2d-wrap.guide-ios-visible video.scene-video-2d {
  opacity: 1 !important;
  mix-blend-mode: lighten;
  position: relative;
}
.scene-video-mask.guide-img-matte img.guide-video-frame {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center center;
  pointer-events: none;
}
#guideIosOverlayRoot {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 360;
  overflow: visible;
}
.guide-ios-screen-overlay {
  position: absolute;
  display: none;
  pointer-events: none;
  mix-blend-mode: normal;
  box-sizing: border-box;
}
.guide-ios-screen-overlay.guide-img-matte {
  mix-blend-mode: normal;
}
.guide-ios-screen-overlay.guide-ios-canvas-matte {
  mix-blend-mode: normal;
  background: transparent !important;
  isolation: isolate;
}
.guide-ios-screen-overlay.guide-ios-canvas-matte .scene-video-mask {
  background: transparent;
}
/* iPad 画面固定: PC と同じ lighten（黒背景が透ける・髪のアルファ抜き不要） */
.guide-ios-screen-overlay.guide-ios-screen-lighten {
  mix-blend-mode: lighten;
  -webkit-mix-blend-mode: lighten;
  background: transparent !important;
  isolation: isolate;
}
.guide-ios-screen-overlay.guide-ios-screen-lighten .scene-video-mask {
  mix-blend-mode: lighten;
  -webkit-mix-blend-mode: lighten;
  background: transparent;
}
.guide-ios-screen-overlay.guide-ios-screen-lighten video.scene-video-2d {
  mix-blend-mode: lighten;
  -webkit-mix-blend-mode: lighten;
  opacity: 1 !important;
  background: transparent;
}
.guide-ios-screen-overlay.guide-ios-canvas-matte canvas.guide-video-canvas {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center center;
  background: transparent;
}
.scene-video-mask.guide-canvas-matte canvas.guide-video-canvas {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center center;
  background: transparent;
  vertical-align: top;
}
.scene-video-mask.guide-canvas-matte video.scene-video-2d {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
  pointer-events: none;
}
.scene-video-ground-shadow {
  display: none;
}
.scene-video-mask { z-index: 1; }

.portal-linked-video {
  position: absolute;
  left: 1.5%;
  top: 1.5%;
  width: 97%;
  height: 97%;
  object-fit: cover;
  display: block;
  background: #000;
  opacity: 0;
  transition: opacity 0.6s ease-in-out;
  z-index: 3;
  pointer-events: none;
  -webkit-mask-image: radial-gradient(ellipse 88% 82% at 50% 50%, #000 42%, transparent 100%);
  mask-image: radial-gradient(ellipse 88% 82% at 50% 50%, #000 42%, transparent 100%);
}
.portal-linked-video.is-playing {
  opacity: 1;
}

/* 2D動画・全画面（既定。imageHotspots の videoSrc など） */
.video-fs-overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 800;
  background: rgba(0, 0, 0, 0.92);
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: opacity 1.15s ease-in-out;
  pointer-events: auto;
  touch-action: manipulation;
}
.video-fs-overlay.is-active {
  display: flex;
}
.video-fs-overlay.is-visible {
  opacity: 1;
}
.video-fs-player {
  position: absolute;
  inset: 0;
  z-index: 1;
  width: 100vw;
  height: 100vh;
  max-width: 100%;
  max-height: 100%;
  object-fit: cover;
  background: #000;
  opacity: 0;
  transition: opacity 1.05s ease-in-out;
  -webkit-mask-image: radial-gradient(ellipse 96% 94% at 50% 50%, #000 58%, rgba(0,0,0,0.85) 78%, transparent 100%);
  mask-image: radial-gradient(ellipse 96% 94% at 50% 50%, #000 58%, rgba(0,0,0,0.85) 78%, transparent 100%);
}
.video-fs-image {
  position: absolute;
  inset: 0;
  z-index: 2;
  width: 100vw;
  height: 100vh;
  object-fit: cover;
  opacity: 0;
  transform: scale(1.18);
  transition: opacity 1.05s ease-in-out, transform 5.2s ease-out;
  -webkit-mask-image: radial-gradient(ellipse 96% 94% at 50% 50%, #000 58%, rgba(0,0,0,0.85) 78%, transparent 100%);
  mask-image: radial-gradient(ellipse 96% 94% at 50% 50%, #000 58%, rgba(0,0,0,0.85) 78%, transparent 100%);
}
.video-fs-start-image {
  position: absolute;
  inset: 0;
  z-index: 3;
  width: 100vw;
  height: 100vh;
  object-fit: contain;
  opacity: 0;
  transform: scale(0.82);
  transition: opacity 0.8s ease-in-out, transform 1.15s ease-in-out;
}
.video-fs-overlay.is-visible .video-fs-player,
.video-fs-overlay.is-visible .video-fs-image {
  opacity: 1;
}
.video-fs-overlay.is-visible .video-fs-image {
  transform: scale(1);
}
.video-fs-overlay.is-waiting-still .video-fs-image {
  opacity: 0;
  transform: scale(1.18);
}
.video-fs-overlay.is-visible.is-waiting-still .video-fs-start-image {
  opacity: 1;
  transform: scale(1);
}
.video-fs-overlay.is-waiting-still.is-image-revealed .video-fs-image {
  opacity: 1;
  transform: scale(1);
}
.video-fs-overlay.is-waiting-still.is-image-revealed .video-fs-start-image {
  opacity: 0;
  transform: scale(1.08);
}
.video-fs-overlay.is-fading-out {
  opacity: 0;
  pointer-events: none;
}
.video-fs-overlay.is-fading-out .video-fs-player,
.video-fs-overlay.is-fading-out .video-fs-image,
.video-fs-overlay.is-fading-out .video-fs-start-image {
  opacity: 0;
  transition: opacity 0.95s ease-in-out;
}

body.embed-placer #speedContainer,
body.embed-placer #zoomContainer,
body.embed-placer #fadeContainer,
body.embed-placer #crosshair { display: none !important; }
body.embed-placer #sceneText { display: none !important; }
body.embed-placer #videoFullscreenOverlay { display: none !important; }
body.embed-placer .scene-video-2d-wrap { pointer-events: none !important; }

#viewerBuildBadge { display: none !important; }
#viewerBuildBadge.guide-ios-build-on {
  display: block !important;
  position: fixed;
  left: 6px;
  bottom: 6px;
  z-index: 9999;
  font: 10px/1.3 sans-serif;
  color: rgba(255, 255, 255, 0.92);
  background: rgba(0, 0, 0, 0.45);
  padding: 3px 7px;
  border-radius: 4px;
  pointer-events: none;
}

</style>
</head>

<body>
<div id="pano"></div>
<div id="sceneText"></div>
<div id="fadeOverlay"></div>
<div id="blurOverlay"></div>
<div id="videoFullscreenOverlay" class="video-fs-overlay" aria-hidden="true">
  <video id="videoFullscreenPlayer" class="video-fs-player" playsinline webkit-playsinline></video>
  <img id="imageFullscreenPlayer" class="video-fs-image" alt="">
  <img id="imageFullscreenStart" class="video-fs-start-image" alt="">
</div>
<div id="crosshair"></div>

<div id="compassContainer">
  <div id="degreeCircle"><span id="yawTxt">0°</span><small id="pitchTxt">0°</small></div>
  <div id="compassCircle">
    <svg id="compassNeedle" viewBox="0 0 100 100" width="45" height="45" style="transition: transform 0.1s linear;">
      <polygon points="50,90 65,50 35,50" fill="#999999" />
      <polygon points="50,10 65,50 35,50" fill="#E60000" />
      <text x="50" y="42" font-family="sans-serif" font-size="20" fill="white" font-weight="bold" text-anchor="middle">N</text>
      <circle cx="50" cy="50" r="5" fill="#333333" />
    </svg>
  </div>
</div>

<div id="volumeContainer">
  <span id="volumeLabel">VOL</span>
  <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="0.5">
</div>
<div id="speedContainer" class="auto-ctrl"><span class="ctrl-label">速度</span><input type="range" id="speedSlider" class="ctrl-slider" min="1" max="9" step="1" value="6"><span class="ctrl-val" id="speedVal">少し速</span></div>
<div id="zoomContainer" class="auto-ctrl"><span class="ctrl-label">ズーム幅</span><input type="range" id="zoomSlider" class="ctrl-slider" min="1" max="9" step="1" value="2"><span class="ctrl-val" id="zoomVal">極小</span></div>
<div id="fadeContainer" class="auto-ctrl"><span class="ctrl-label">フェード幅</span><input type="range" id="fadeSlider" class="ctrl-slider" min="1" max="9" step="1" value="8"><span class="ctrl-val" id="fadeVal">極大</span></div>

<img id="mapButton" src="Map戻り-removebg-preview.png" onclick="goToMap()">
<div id="counter">1</div>
<img id="arrowUp" class="arrow-nav" src="上-removebg-preview.png">
<img id="arrowDown" class="arrow-nav" src="下-removebg-preview.png">
<img id="arrowLeft" class="arrow-nav" src="左-removebg-preview.png">
<img id="arrowRight" class="arrow-nav" src="右-removebg-preview.png">
<img id="arrowUpGreen" class="arrow-nav" src="緑上-removebg-preview.png" alt="緑矢印（上・前進）">
<img id="arrowDownGreen" class="arrow-nav" src="緑上-removebg-preview.png" alt="緑矢印（下・後退）">
<img id="arrowBlueLeft" class="arrow-nav" src="青左-removebg-preview.png">
<img id="arrowBlueRight" class="arrow-nav" src="青右-removebg-preview.png">

<script src="vendor/marzipano.js"></script>
<script>
// ポータル画像は data.js の imageHotspots（sourceScene / sceneStartId で出発地に紐付け）

// ========================================
// ★ 修正案A：URLパラメータ読み込みをIIFE外に移動
// スコープ隔離による greenArrowConfig 消失を解決
// ========================================
var urlParams = new URLSearchParams(window.location.search);
var embedPlacerMode = urlParams.get('embed') === '1';
if (embedPlacerMode) document.body.classList.add('embed-placer');
var initialYaw = urlParams.get('yaw');
// ★ 前後左右反転フラグ（?flip=1 で全矢印方向を逆にする）
var flipDir = urlParams.get('flip') === '1';
// ★タイルフォルダ名（実フォルダに合わせて 'tiles'）
window.TILES_BASE = "tiles1024";

// data.js 読み込み（iPad Safari 向け: script + クエリでキャッシュ回避。new Function は使わない）
(function loadDataAndBoot() {
  function logGuideHotspotFromData() {
    try {
      var sc = (window.APP_DATA && window.APP_DATA.scenes) || [];
      for (var i = 0; i < sc.length; i++) {
        if (sc[i] && sc[i].id === '25-cc003' && sc[i].videoHotspots && sc[i].videoHotspots[0]) {
          var h = sc[i].videoHotspots[0];
          console.log('🎬 data.js 25-cc003 guide: yaw=' + h.yaw + ' pitch=' + h.pitch +
            ' w=' + h.width + ' h=' + h.height);
          return;
        }
      }
    } catch (eLog) {}
  }

  function applyDataOverlayAndStart() {

/** 緑矢印の遷移先ID補正（17dd001 → 17-dd001）。グローバル定義（URL読込より前） */
function resolveSceneId(rawId) {
  if (!rawId) return null;
  var s = String(rawId).trim();
  if (typeof scenesData !== 'undefined' && scenesData && scenesData[s]) return s;
  if (window.APP_DATA && window.APP_DATA.scenes) {
    var compact = s.replace(/-/g, '');
    for (var i = 0; i < window.APP_DATA.scenes.length; i++) {
      var sid = window.APP_DATA.scenes[i].id;
      if (sid === s) return sid;
      if (sid.replace(/-/g, '') === compact) return sid;
    }
    var m = s.match(/^(\d+)([a-z]{2})(\d{3})$/i);
    if (m) {
      var fixed = m[1] + '-' + m[2].toLowerCase() + m[3];
      for (var j = 0; j < window.APP_DATA.scenes.length; j++) {
        if (window.APP_DATA.scenes[j].id === fixed) return fixed;
      }
    }
  }
  return null;
}

function normalizeGreenArrowConfig() {

  window.greenArrowConfig.arrows = window.greenArrowConfig.arrows.map(function(a) {
    var tid = resolveSceneId(a.targetSceneId) || a.targetSceneId;
    if (tid !== a.targetSceneId) {
      console.warn('⚠️ 緑矢印の遷移先IDを補正:', a.targetSceneId, '→', tid);
    }
    var out = {
      sceneId: a.sceneId,

      endAngle: a.endAngle,
      targetSceneId: tid
    };
    if (a.direction === 'down') out.direction = 'down';

}

/** 旧 rules 形式 → 新形式（type/target/crossroads） */
function normalizeSideBranchEntry(entry) {
  if (!entry) return entry;
  if (entry.type === 'branch' || entry.type === 'return') return entry;
  if (!entry.rules || !entry.rules.length) return entry;
  var sceneId = entry.sceneId;
  for (var i = 0; i < entry.rules.length; i++) {
    if (entry.rules[i].whenReturn) {
      return { sceneId: sceneId, type: 'return' };
    }
  }
  var targets = [];
  entry.rules.forEach(function(rule) {
    (rule.exits || []).forEach(function(ex) {
      if (ex.action === 'return' || !ex.targetSceneId) return;
      var tid = resolveSceneId(ex.targetSceneId) || ex.targetSceneId;
      if (targets.indexOf(tid) < 0) targets.push(tid);
    });
  });
  if (!targets.length) return { sceneId: sceneId, type: 'branch' };
  return {
    sceneId: sceneId,
    type: 'branch',
    target: targets[0],
    targetAlt: targets.length > 1 ? targets[1] : null,
    crossroads: targets.length > 1
  };
}

function startViewer() {
'use strict';
var Marzipano = window.Marzipano;
var data = window.APP_DATA;

function sceneIdParts(id) {
  var match = String(id || '').match(/-([a-zA-Z]+)(\d+)$/);
  return match ? { course: match[1].toLowerCase(), number: parseInt(match[2], 10) } : null;
}

function inferScenePosition(sd) {
  var pos = Number(sd.position);
  if (Number.isFinite(pos)) return pos;
  var parts = sceneIdParts(sd.id);
  return parts && Number.isFinite(parts.number) ? parts.number : 1;
}

function normalizeSceneDirection(sd) {
  var dir = String(sd.direction || '').toLowerCase();
  if (dir === 'main') return 'iki';
  if (dir === 'iki' || dir === 'left' || dir === 'right' || dir === 'portal') return dir;

  var parts = sceneIdParts(sd.id);
  if (!parts) return 'iki';
  if (parts.course === 'bb') return 'left';
  if (parts.course === 'cc') return 'right';
  if (parts.course === 'dd') return 'portal';
  return 'iki';
}

function sceneCourseKey(sd) {
  if (sd && sd.course) return String(sd.course).toLowerCase();
  var parts = sceneIdParts(sd && sd.id);
  return parts ? parts.course : normalizeSceneDirection(sd || {});
}

var CC_CHAIN_SCENE_IDS = {
  1: '23-cc001',
  2: '24-cc002',
  3: '25-cc003'
};

function ccChainIndexForSceneId(sceneId) {
  for (var p in CC_CHAIN_SCENE_IDS) {
    if (CC_CHAIN_SCENE_IDS.hasOwnProperty(p) && CC_CHAIN_SCENE_IDS[p] === sceneId) {
      return Number(p);
    }
  }
  return null;
}

function formatCounterLabel(sceneData) {
  if (!sceneData) return '?';
  var ccIdx = ccChainIndexForSceneId(sceneData.id);
  if (ccIdx != null) return 'C' + ccIdx;
  var parts = sceneIdParts(sceneData.id);
  if (parts) {
    if (parts.course === 'bb') return 'B' + parts.number;
    if (parts.course === 'cc') return 'C' + parts.number;
    if (parts.course === 'dd') return 'D' + parts.number;
  }
  var pos = Number(inferScenePosition(sceneData));
  var course = sceneCourseKey(sceneData);
  if (course === 'bb') return 'B' + pos;
  if (course === 'cc') return 'C' + pos;
  if (course === 'dd') return 'D' + pos;
  return String(pos);
}

function refreshCounterDisplay() {
  if (!counterEl || !currentSceneObj) return;
  counterEl.textContent = formatCounterLabel(currentSceneObj.data);
}

function angleDiffDeg(a, b) {
  var diff = a - b;
  while (diff > 180) diff -= 360;
  while (diff < -180) diff += 360;
  return diff;
}

function legacyPortalCenterRange(ih) {
  var ymin = typeof ih.yawMin === 'number' && !isNaN(ih.yawMin) ? ih.yawMin : 0;
  var ymax = typeof ih.yawMax === 'number' && !isNaN(ih.yawMax) ? ih.yawMax : ymin;
  var center = normalizeAngle(degToRad((ymin + angleDiffDeg(ymax, ymin) / 2))) * 180 / Math.PI;
  var range = Math.abs(angleDiffDeg(ymax, ymin)) / 2;
  return { center: center, range: range };
}

function portalCenterDeg(ih) {
  if (typeof ih.yawCenter === 'number' && !isNaN(ih.yawCenter)) return ih.yawCenter;
  return legacyPortalCenterRange(ih).center;
}

function portalRangeDeg(ih) {
  if (typeof ih.yawRange === 'number' && !isNaN(ih.yawRange)) return Math.max(0, ih.yawRange);
  return legacyPortalCenterRange(ih).range;
}

function portalPlacementYawRad(ih) {
  return degToRad(portalCenterDeg(ih));
}

function isRevealPortal(ih) {

    growHalf:   { reveal: false, grow: true,  coverOpacity: 0.5, startScale: 0.94, endScale: 1.12, holdMin: 2500, coverFade: 1200, appearMax: 1800, appearMin: 900 },

  return String(raw).replace(/\s{2,}/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
}

function scaledSceneTextFontSize(fontSize) {
  var px = parseFloat(fontSize);
  if (!isFinite(px)) return fontSize || '20px';
  return Math.round(px * sceneTextScale) + 'px';
}

function preparePortalMotion(inner, cover, ih, fadeMs) {
  var preset = portalEffectPreset(ih);
  inner.style.transitionDuration = Math.max(0, fadeMs) + 'ms';
  if (preset.grow) {
    inner.style.transform = 'scale(' + preset.startScale + ')';
  }
  if (cover) {
    cover.style.transition = 'none';
    cover.style.opacity = String(preset.coverOpacity);
    cover.getBoundingClientRect();
    cover.style.transitionProperty = 'opacity';
    cover.style.transitionTimingFunction = 'ease-in-out';
    cover.style.transitionDuration = Math.max(0, preset.coverFade) + 'ms';
  }
}

function showPortalMotion(inner, cover, ih, zoomMs) {
  var preset = portalEffectPreset(ih);
  if (inner && preset.grow) {
    inner.style.transitionDuration = Math.max(0, zoomMs) + 'ms';
    inner.style.transform = 'scale(' + preset.endScale + ')';
  }
  if (cover) {
    var holdMs = portalStartHoldMs(ih, preset);
    setTimeout(function() {
      cover.style.transitionDuration = Math.max(0, preset.coverFade) + 'ms';
      cover.style.opacity = '0';
    }, holdMs);
  }
}

function hidePortalMotion(inner, cover, ih) {
  var preset = portalEffectPreset(ih);
  if (inner && preset.grow) inner.style.transform = 'scale(' + preset.startScale + ')';
  if (cover) cover.style.opacity = String(preset.coverOpacity);
}

function setPortalTappable(hs, enabled) {
  if (!hs || !hs.img) return;
  hs.portalActive = !!enabled;
  if (enabled) hs.img.classList.add('portal-tappable');
  else hs.img.classList.remove('portal-tappable');
  hs.img.style.pointerEvents = 'none';
  if (hs.hitArea) hs.hitArea.style.pointerEvents = enabled ? 'auto' : 'none';
}

var portalDiveAnimToken = 0;

function easeOutCubic01(t) {
  t = Math.max(0, Math.min(1, t));
  return 1 - Math.pow(1 - t, 3);
}

function isPortalDiveTransition(ih) {
  if (!ih) return false;
  if (ih.transition === 'dive' || ih.portalTransition === 'dive') return true;
  return ih.effect === 'portalDive';
}

function portalDiveFovRad(ih, which) {
  var radKey = which === 'start' ? 'diveStartFov' : 'diveEndFov';
  var degKey = which === 'start' ? 'diveStartFovDeg' : 'diveEndFovDeg';
  if (ih && ih[radKey] != null && isFinite(ih[radKey])) return ih[radKey];
  if (ih && ih[degKey] != null && isFinite(ih[degKey])) return degToRad(ih[degKey]);
  if (which === 'start') return degToRad(28);
  return null;
}

function resolvePortalDiveEndFov(ih, targetSceneId) {
  var end = portalDiveFovRad(ih, 'end');
  if (end != null) return end;
  var obj = scenesData[targetSceneId];
  if (obj && obj.data.initialViewParameters && obj.data.initialViewParameters.fov != null) {
    return obj.data.initialViewParameters.fov;
  }
  return currentView ? currentView.parameters().fov : degToRad(66);
}

function animateViewFov(view, fromFov, toFov, durationMs, token) {
  if (!view) return;
  if (!durationMs || durationMs <= 0) {
    view.setParameters({ fov: toFov });
    return;
  }
  var start = performance.now();
  var yaw = view.parameters().yaw;
  var pitch = view.parameters().pitch;
  function tick(now) {
    if (token !== portalDiveAnimToken) return;
    var t = easeOutCubic01(Math.min(1, (now - start) / durationMs));
    view.setParameters({
      yaw: yaw,
      pitch: pitch,
      fov: fromFov + (toFov - fromFov) * t
    });
    if (t < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function setPortalDiveBlur(active, durationMs) {
  var blurEl = document.getElementById('blurOverlay');
  if (!blurEl) return;
  blurEl.style.setProperty('--bx', '50%');
  blurEl.style.setProperty('--by', '50%');
  blurEl.style.setProperty('--innerR', '80px');
  blurEl.style.setProperty('--outerR', '320px');
  blurEl.style.setProperty('--blurPx', active ? '20px' : '8px');
  blurEl.style.transition = 'opacity ' + Math.max(300, Math.round(durationMs * 0.65)) + 'ms ease-out';
  blurEl.style.opacity = active ? '0.75' : '0';
}

function playPortalDiveTransition(hs) {
  var ih = hs.ih;
  if (!ih || !ih.targetScene) return;

  portalDiveAnimToken += 1;
  var token = portalDiveAnimToken;
  var dur = Math.max(400, ih.diveDurationMs || 2800);
  var startFov = portalDiveFovRad(ih, 'start');
  var endFov = resolvePortalDiveEndFov(ih, ih.targetScene);
  var useBlur = ih.diveBlur !== false;
  var targetScene = ih.targetScene;
  var sameScene = currentSceneObj && currentSceneObj.data.id === targetScene;

  if (hs.autoFadeTimer) {
    clearTimeout(hs.autoFadeTimer);
    hs.autoFadeTimer = null;
  }
  hidePortalMotion(hs.inner, hs.cover, ih);
  if (hs.portalImg) {
    hs.portalImg.style.transition = 'opacity 0.45s ease-out';
    hs.portalImg.style.opacity = '0';
  }
  hs.img.style.transition = 'opacity 0.5s ease-out';
  hs.img.style.opacity = '0';
  window[hs.flagKey] = true;

  if (useBlur) setPortalDiveBlur(true, dur);

  setTimeout(function() {
    if (token !== portalDiveAnimToken) return;

    if (sameScene) {
      if (ih.targetYaw !== undefined && ih.targetPitch !== undefined && currentView) {
        currentView.setParameters({
          yaw: ih.targetYaw,
          pitch: ih.targetPitch,
          fov: startFov
        });
      } else if (currentView) {
        currentView.setParameters({ fov: startFov });
      }
      animateViewFov(currentView, startFov, endFov, dur, token);
    } else {
      switchScene(targetScene, ih.targetYaw, ih.targetPitch, startFov, true);
      setTimeout(function() {
        if (token !== portalDiveAnimToken || !currentView) return;
        animateViewFov(currentView, startFov, endFov, dur, token);
      }, 100);
    }

    setTimeout(function() {
      if (token !== portalDiveAnimToken) return;
      if (useBlur) setPortalDiveBlur(false, dur);
    }, Math.round(dur * 0.35));
  }, 320);
}

function bindPortalTap(el, onTap) {
  var lastTouchEnd = 0;
  var touchMoved = false;
  el.addEventListener('touchstart', function(e) {
    touchMoved = false;
    e.stopPropagation();
  }, { passive: true });
  el.addEventListener('touchmove', function() {
    touchMoved = true;
  }, { passive: true });
  el.addEventListener('touchend', function(e) {
    if (touchMoved) return;
    lastTouchEnd = Date.now();
    e.preventDefault();
    e.stopPropagation();
    onTap(e);
  }, { passive: false });
  el.addEventListener('click', function(e) {
    if (Date.now() - lastTouchEnd < 600) return;
    e.preventDefault();
    e.stopPropagation();
    onTap(e);
  });
}

function onPortalHotspotTap(hs) {
  if (!hs || !hs.portalActive || !hs.ih) return;
  var ih = hs.ih;
  if (ih.frameSequence && resolveFrameSequenceUrls(ih.frameSequence).length && ih.playVideoOnTap !== false && !isPortalDiveTransition(ih)) {
    setPortalTappable(hs, false);
    playLinkedPortalVideo(hs);
    return;
  }
  if (ih.videoSrc && ih.playVideoOnTap !== false && !isPortalDiveTransition(ih) && isSupportedFullscreenMediaSrc(ih.videoSrc)) {
    setPortalTappable(hs, false);
    playLinkedPortalVideo(hs);
    return;
  }
  if (ih.videoSrc && ih.playVideoOnTap !== false && !isSupportedFullscreenMediaSrc(ih.videoSrc)) {
    console.warn('⚠️ videoSrc は対応形式ではないため、再生をスキップします:', ih.videoSrc);
  }
  if (!ih.targetScene) return;
  setPortalTappable(hs, false);
  if (isPortalDiveTransition(ih)) {
    console.log('🌸 ポータル・ダイブ → ' + ih.targetScene);
    playPortalDiveTransition(hs);
    return;
  }
  console.log('🎎 hotspot タップ → ' + ih.targetScene + ' に移動');
  switchScene(ih.targetScene, ih.targetYaw, ih.targetPitch, currentView.parameters().fov, true);
}

function isSupportedVideoSrc(src) {
  var clean = String(src || '').split('?')[0].split('#')[0].toLowerCase();
  return /\.(mp4|m4v|webm|mov|ogv|ogg)$/.test(clean);
}

function isSupportedImageSrc(src) {
  var clean = String(src || '').split('?')[0].split('#')[0].toLowerCase();
  return /\.(jpg|jpeg|png|gif|webp)$/.test(clean);
}

function isSupportedFullscreenMediaSrc(src) {
  return isSupportedVideoSrc(src) || isSupportedImageSrc(src);
}

var fullscreenVideoOnEnd = null;
var fullscreenFadeOutTimer = null;
var fullscreenFrameSeqTimer = null;
var clipPanoramaScene = null;
var clipPanoramaView = null;
var clipPanoramaGeometry = null;
var clipPanoramaScenes = [];
var clipPanoramaDestroyTimers = [];
var VIDEO_FS_FADE_IN_MS = 1150;
var VIDEO_FS_FADE_OUT_MS = 1000;

function resolveFrameSequenceUrls(seq) {
  if (!seq) return [];
  if (Array.isArray(seq.files) && seq.files.length) {
    return seq.files.filter(function(u) { return !!u; });
  }
  var folder = String(seq.folder || seq.dir || '').replace(/\\/g, '/');
  if (folder && folder.slice(-1) !== '/') folder += '/';
  var count = Number(seq.count || seq.length || 0);
  var ext = seq.ext || '.jpg';
  if (!count || count < 1) return [];

  // 0-dd001.jpg, 1-dd002.jpg …（動画切り出し＋番号並べの命名）
  if (seq.nameStyle === 'index-ddseq') {
    var startIndex = seq.startIndex != null ? Number(seq.startIndex) : 0;
    var startSeq = seq.startSeq != null ? Number(seq.startSeq) : 1;
    var seqPad = seq.seqPad != null ? Number(seq.seqPad) : 3;
    var seqPrefix = seq.seqPrefix || 'dd';
    var urls = [];
    for (var i = 0; i < count; i++) {
      var idx = startIndex + i;
      var seqNum = startSeq + i;
      var seqStr = String(seqNum);
      while (seqStr.length < seqPad) seqStr = '0' + seqStr;
      urls.push(folder + idx + '-' + seqPrefix + seqStr + ext);
    }
    return urls;
  }

  var base = seq.base || seq.prefix || '';
  if (!base && !folder) return [];
  var start = seq.start != null ? Number(seq.start) : 1;
  var pad = seq.pad != null ? Number(seq.pad) : 4;
  var urls = [];
  for (var j = 0; j < count; j++) {
    var n = start + j;
    var num = String(n);
    while (num.length < pad) num = '0' + num;
    urls.push((folder || '') + base + num + ext);
  }
  return urls;
}

function stopFullscreenFrameSequence() {
  if (fullscreenFrameSeqTimer) {
    clearTimeout(fullscreenFrameSeqTimer);
    clearInterval(fullscreenFrameSeqTimer);
    fullscreenFrameSeqTimer = null;
  }
}

function clearClipPanoramaDestroyTimers() {
  clipPanoramaDestroyTimers.forEach(function(t) { clearTimeout(t); });
  clipPanoramaDestroyTimers = [];
}

function destroyClipPanoramaScene() {
  clearClipPanoramaDestroyTimers();
  clipPanoramaScenes.forEach(function(s) {
    if (viewer) {
      try { viewer.destroyScene(s); } catch (e) {}
    }
  });
  clipPanoramaScenes = [];
  clipPanoramaScene = null;
  clipPanoramaView = null;
}

function preloadFrameUrls(urls) {
  return Promise.all(urls.map(function(url) {
    return new Promise(function(resolve, reject) {
      var im = new Image();
      im.onload = function() { resolve(im); };
      im.onerror = function() { reject(new Error(url)); };
      im.src = url;
    });
  }));
}

function showPanoramaFrameSequence(seq, opts) {
  opts = opts || {};
  var urls = resolveFrameSequenceUrls(seq);
  if (!urls.length) {
    console.warn('⚠️ frameSequence に画像がありません');
    if (opts.onEnd) opts.onEnd();
    return;
  }
  if (!viewer || !currentView) {
    console.warn('⚠️ VR表示の準備ができていないため平面再生にフォールバック');
    showFullscreenFrameSequence(seq, opts);
    return;
  }

  fadeOutBgmForVideo();
  stopFullscreenFrameSequence();
  destroyClipPanoramaScene();
  clipPanoramaGeometry = null;
  hideFullscreenVideo(false, true);

  var durationMs = Math.max(500, Number(seq.durationMs || opts.durationMs) || 5000);
  var crossfadeMs = Math.max(0, Math.min(280, Number(seq.crossfadeMs) || 110));
  var intervalMs = Math.max(crossfadeMs + 24, Math.round(durationMs / urls.length));
  var holdMs = Math.max(8, intervalMs - crossfadeMs);
  var savedParams = {
    yaw: currentView.parameters().yaw,
    pitch: currentView.parameters().pitch,
    fov: currentView.parameters().fov
  };

  if (fullscreenFadeOutTimer) {
    clearTimeout(fullscreenFadeOutTimer);
    fullscreenFadeOutTimer = null;
  }
  fullscreenVideoOnEnd = opts.onEnd || null;

  function finishSequence() {
    stopFullscreenFrameSequence();
    var cb = fullscreenVideoOnEnd;
    fullscreenVideoOnEnd = null;
    var waitMs = crossfadeMs + 80;
    clipPanoramaDestroyTimers.push(setTimeout(function() {
      destroyClipPanoramaScene();
      clipPanoramaGeometry = null;
      if (cb) cb();
    }, waitMs));
  }

  function startPlayback(equirectWidth) {
    clipPanoramaGeometry = new Marzipano.EquirectGeometry([{ width: equirectWidth }]);

    function getViewParams() {
      if (clipPanoramaView) return clipPanoramaView.parameters();
      return savedParams;
    }

    function mountClipFrame(url, isFirst) {
      var viewParams = getViewParams();
      var limiter = Marzipano.RectilinearView.limit.traditional(
        equirectWidth, 75 * Math.PI / 180, 120 * Math.PI / 180
      );
      var view = new Marzipano.RectilinearView({
        yaw: viewParams.yaw,
        pitch: viewParams.pitch,
        fov: viewParams.fov
      }, limiter);
      var source = Marzipano.ImageUrlSource.fromString(url);
      var scene = viewer.createScene({
        source: source,
        geometry: clipPanoramaGeometry,
        view: view
      });
      var outgoing = clipPanoramaScene;
      scene.switchTo({ transitionDuration: isFirst ? 0 : crossfadeMs });
      clipPanoramaScene = scene;
      clipPanoramaView = view;
      clipPanoramaScenes.push(scene);
      if (outgoing) {
        clipPanoramaDestroyTimers.push(setTimeout(function() {
          if (!viewer) return;
          try { viewer.destroyScene(outgoing); } catch (e) {}
          clipPanoramaScenes = clipPanoramaScenes.filter(function(s) { return s !== outgoing; });
        }, crossfadeMs + 70));
      }
    }

    preloadFrameUrls(urls).then(function() {
      var frameIndex = 0;

      function showNext() {
        try {
          mountClipFrame(urls[frameIndex], frameIndex === 0);
        } catch (err) {
          console.warn('⚠️ VR連番フレーム失敗:', urls[frameIndex], err);
          destroyClipPanoramaScene();
          clipPanoramaGeometry = null;
          showFullscreenFrameSequence(seq, opts);
          return;
        }
        frameIndex++;
        if (frameIndex >= urls.length) {
          fullscreenFrameSeqTimer = setTimeout(finishSequence, holdMs);
        } else {
          fullscreenFrameSeqTimer = setTimeout(showNext, holdMs + crossfadeMs);
        }
      }

      showNext();
      console.log(
        '🌐 VR連番再生: ' + urls.length + '枚 / ' + (durationMs / 1000).toFixed(1) + '秒' +
        ' (約' + Math.round(1000 / intervalMs) + 'fps, クロスフェード' + crossfadeMs + 'ms, 幅' + equirectWidth + ')'
      );
    }).catch(function(err) {
      console.warn('⚠️ 連番画像の先読みに失敗:', err);
      showFullscreenFrameSequence(seq, opts);
    });
  }

  var probe = new Image();
  probe.onload = function() {
    var w = probe.naturalWidth;
    var h = probe.naturalHeight;
    if (h > 0 && Math.abs(w / h - 2) < 0.12) {
      startPlayback(w);
    } else {
      console.warn('⚠️ 2:1パノラマではない (' + w + '×' + h + ')。平面再生にフォールバック');
      showFullscreenFrameSequence(seq, opts);
    }
  };
  probe.onerror = function() {
    console.warn('⚠️ 1枚目を読み込めません:', urls[0], '— 平面再生を試します');
    showFullscreenFrameSequence(seq, opts);
  };
  probe.src = urls[0];
}

function showFrameSequence(seq, opts) {
  opts = opts || {};
  var usePanorama = opts.preferPanorama === true || seq.vr === true || seq.display === 'panorama';
  if (seq.display === 'flat') usePanorama = false;
  if (usePanorama) showPanoramaFrameSequence(seq, opts);
  else showFullscreenFrameSequence(seq, opts);
}

function showFullscreenFrameSequence(seq, opts) {
  opts = opts || {};
  destroyClipPanoramaScene();
  var urls = resolveFrameSequenceUrls(seq);
  if (!urls.length) {
    console.warn('⚠️ frameSequence に画像がありません');
    if (opts.onEnd) opts.onEnd();
    return;
  }
  fadeOutBgmForVideo();
  var overlay = document.getElementById('videoFullscreenOverlay');
  var vid = document.getElementById('videoFullscreenPlayer');
  var img = document.getElementById('imageFullscreenPlayer');
  var startImg = document.getElementById('imageFullscreenStart');
  if (!overlay || !img) return;

  stopFullscreenFrameSequence();
  if (fullscreenFadeOutTimer) {
    clearTimeout(fullscreenFadeOutTimer);
    fullscreenFadeOutTimer = null;
  }
  fullscreenVideoOnEnd = opts.onEnd || null;

  if (vid) {
    try { vid.pause(); } catch (e) {}
    vid.removeAttribute('src');
    vid.style.display = 'none';
    vid.style.opacity = '0';
  }
  if (startImg) {
    startImg.removeAttribute('src');
    startImg.style.display = 'none';
    startImg.style.opacity = '0';
  }

  var durationMs = Math.max(500, Number(seq.durationMs || opts.durationMs) || 5000);
  var intervalMs = Math.max(20, Math.round(durationMs / urls.length));
  var frameIndex = 0;

  img.style.display = 'block';
  img.style.transition = 'none';
  img.style.transform = 'scale(1)';
  img.style.transformOrigin = 'center center';
  img.style.opacity = '1';

  function finishSequence() {
    stopFullscreenFrameSequence();
    if (opts.manualEnd && fullscreenVideoOnEnd) {
      var cb = fullscreenVideoOnEnd;
      fullscreenVideoOnEnd = null;
      cb();
    } else {
      hideFullscreenVideo(true, false);
    }
  }

  function showFrame(idx) {
    img.onerror = function() {
      console.warn('⚠️ 連番画像を読み込めません:', urls[idx]);
    };
    img.src = urls[idx];
  }

  urls.forEach(function(u) {
    var pre = new Image();
    pre.src = u;
  });

  overlay.classList.remove('is-fading-out', 'is-visible', 'is-waiting-still', 'is-image-revealed');
  overlay.classList.add('is-active');
  overlay.setAttribute('aria-hidden', 'false');
  showFrame(0);
  requestAnimationFrame(function() {
    requestAnimationFrame(function() {
      overlay.classList.add('is-visible');
    });
  });

  fullscreenFrameSeqTimer = setInterval(function() {
    frameIndex++;
    if (frameIndex >= urls.length) {
      finishSequence();
      return;
    }
    showFrame(frameIndex);
  }, intervalMs);

  console.log('🎞 連番画像再生: ' + urls.length + '枚 / ' + (durationMs / 1000).toFixed(1) + '秒 (' + Math.round(1000 / intervalMs) + 'fps)');
}

function showFullscreenVideo(src, opts) {
  opts = opts || {};
  fadeOutBgmForVideo();
  var overlay = document.getElementById('videoFullscreenOverlay');
  var vid = document.getElementById('videoFullscreenPlayer');
  var img = document.getElementById('imageFullscreenPlayer');
  var startImg = document.getElementById('imageFullscreenStart');
  if (!overlay || !vid) return;
  if (!isSupportedVideoSrc(src)) {
    console.warn('⚠️ 全画面動画ではない形式のため再生しません:', src);
    if (opts.onEnd) opts.onEnd();
    return;
  }
  if (fullscreenFadeOutTimer) {
    clearTimeout(fullscreenFadeOutTimer);
    fullscreenFadeOutTimer = null;
  }
  fullscreenVideoOnEnd = opts.onEnd || null;
  if (img) {
    img.removeAttribute('src');
    img.style.display = 'none';
    img.style.opacity = '0';
    img.style.transform = 'scale(1.18)';
  }
  if (startImg) {
    startImg.removeAttribute('src');
    startImg.style.display = 'none';
    startImg.style.opacity = '0';
  }
  vid.style.display = 'block';
  vid.style.opacity = '';
  vid.loop = !!opts.loop;
  vid.src = src;
  vid.muted = false;
  vid.onerror = function() {
    console.warn('⚠️ 動画を再生できませんでした:', src);
    hideFullscreenVideo(true, true);
  };
  // manualEnd: 終了処理（角度合わせ等）を先に実行してから閉じたい場合に使う
  if (opts.manualEnd) {
    vid.onended = function() {
      if (vid.loop) return;
      if (fullscreenVideoOnEnd) fullscreenVideoOnEnd();
    };
  } else {
    vid.onended = function() {
      if (vid.loop) return;
      hideFullscreenVideo(true, false);
    };
  }
  overlay.classList.remove('is-fading-out', 'is-visible', 'is-waiting-still', 'is-image-revealed');
  overlay.classList.add('is-active');
  overlay.setAttribute('aria-hidden', 'false');
  requestAnimationFrame(function() {
    requestAnimationFrame(function() {
      overlay.classList.add('is-visible');
    });
  });
  setTimeout(function() {
    vid.play().catch(function() {
      vid.muted = true;
      vid.play().catch(function() {
        console.warn('⚠️ 動画再生に失敗したためスキップします:', src);
        hideFullscreenVideo(true, true);
      });
    });
  }, Math.round(VIDEO_FS_FADE_IN_MS * 0.45));
}

function hideFullscreenVideo(callOnEnd, instant) {
  var overlay = document.getElementById('videoFullscreenOverlay');
  var vid = document.getElementById('videoFullscreenPlayer');
  var img = document.getElementById('imageFullscreenPlayer');
  var startImg = document.getElementById('imageFullscreenStart');
  if (!overlay || !vid) return;

  stopFullscreenFrameSequence();
  destroyClipPanoramaScene();

  function finishHide() {
    overlay.classList.remove('is-active', 'is-visible', 'is-fading-out', 'is-waiting-still', 'is-image-revealed');
    overlay.setAttribute('aria-hidden', 'true');
    try {
      vid.pause();
      vid.currentTime = 0;
    } catch (e) {}
    if (img) {
      img.removeAttribute('src');
      img.style.display = 'none';
      img.style.opacity = '0';
      img.style.transform = 'scale(1.18)';
    }
    if (startImg) {
      startImg.removeAttribute('src');
      startImg.style.display = 'none';
      startImg.style.opacity = '0';
    }
    restoreBgmAfterVideo();
    if (callOnEnd && fullscreenVideoOnEnd) {
      var cb = fullscreenVideoOnEnd;
      fullscreenVideoOnEnd = null;
      cb();
    }
  }

  if (!overlay.classList.contains('is-active')) {
    finishHide();
    return;
  }
  if (overlay.classList.contains('is-fading-out')) return;

  if (instant) {
    if (fullscreenFadeOutTimer) {
      clearTimeout(fullscreenFadeOutTimer);
      fullscreenFadeOutTimer = null;
    }
    finishHide();
    return;
  }

  overlay.classList.remove('is-visible');

function showFullscreenImage(src, opts) {

  var zoomStartScale = Math.max(1.05, Number(opts.zoomStartScale) || 2.7);

        overlay.classList.add('is-image-revealed');

    }

    var hold = Math.max(2200, opts.durationMs || 6800) + startHold + endHold;
    fullscreenFadeOutTimer = setTimeout(function() {
      fullscreenFadeOutTimer = null;
      if (opts.manualEnd) {

function playLinkedPortalVideo(hs) {
  var ih = hs.ih;
  if (!hs.inner || hs.videoPlaying) return;
  hs.videoPlaying = true;
  if (hs.autoFadeTimer) {

    hs.autoFadeTimer = null;
  }
  console.log('🎬 ポータル全画面メディア再生: ' + (ih.frameSequence ? ('連番' + resolveFrameSequenceUrls(ih.frameSequence).length + '枚') : ih.videoSrc));
  fadeOutBgmForVideo();

  if (hs.portalImg) {
    hs.portalImg.style.transition = 'opacity 0.85s ease-in-out';
    hs.portalImg.style.opacity = '0';
  }
  if (hs.cover) {
    hs.cover.style.transition = 'opacity 0.75s ease-in-out';
    hs.cover.style.opacity = '0';
  }

  function finishPortalVideo() {
    if (!hs.videoPlaying) return;
    hs.videoPlaying = false;
    window[hs.flagKey] = true;
    if (hs.linkedVideo) {
      hs.linkedVideo.classList.remove('is-playing');
      try {
        hs.linkedVideo.pause();
        hs.linkedVideo.currentTime = 0;
      } catch (e) {}
    }
    hidePortalMotion(hs.inner, hs.cover, ih);
    if (hs.portalImg) hs.portalImg.style.opacity = '0';
    hs.img.style.transition = 'opacity 1.1s ease-in-out';
    hs.img.style.opacity = '0';
    setPortalTappable(hs, false);

    if (ih.targetSceneAfterVideo) {
      setTimeout(function() {
        switchScene(
          ih.targetSceneAfterVideo,
          ih.targetYawAfterVideo,
          ih.targetPitchAfterVideo,
          currentView.parameters().fov,
          true
        );
      }, 500);
      // 画面遷移の後にフェードで閉じる（yawの一瞬見えを防止）
      setTimeout(function() { hideFullscreenVideo(false, false); }, 750);
      return;
    }

    // 既定動作: targetSceneAfterVideo が無い場合は targetScene/targetYaw/targetPitch を使う。
    // （動画を見終わったら指定した向きへ“戻す/移動する”）
    if (ih.targetScene) {
      var sameScene = currentSceneObj && currentSceneObj.data && currentSceneObj.data.id === ih.targetScene;
      // 先に pano の向きを合わせてから overlay を閉じる（77°が見えるのを防ぐ）
      if (sameScene) {
        if (currentView && ih.targetYaw !== undefined && ih.targetPitch !== undefined) {
          currentView.setParameters({
            yaw: ih.targetYaw,
            pitch: ih.targetPitch,
            fov: currentView.parameters().fov
          });
          requestAnimationFrame(function() {
            if (!currentView) return;
            currentView.setParameters({
              yaw: ih.targetYaw,
              pitch: ih.targetPitch,
              fov: currentView.parameters().fov
            });
            // 次フレームで閉じる（確実に向きが反映された後にフェード開始）
            requestAnimationFrame(function() { hideFullscreenVideo(false, false); });
          });
        }
        return;
      }
      // 別シーンへ移動する場合も、overlay を残したまま switch してから閉じる
      switchScene(
        ih.targetScene,
        ih.targetYaw,
        ih.targetPitch,
        currentView.parameters().fov,
        true
      );
      setTimeout(function() { hideFullscreenVideo(false, false); }, 720);
      return;
    }

    // 遷移先指定が無い場合はそのまま閉じる
    hideFullscreenVideo(false, false);
  }

  var useFullscreen = ih.videoFullscreen !== false;
  if (useFullscreen) {
    setTimeout(function() {
      if (ih.frameSequence && resolveFrameSequenceUrls(ih.frameSequence).length) {
        showFrameSequence(ih.frameSequence, {
          manualEnd: true,
          onEnd: finishPortalVideo,
          preferPanorama: ih.frameSequence.vr !== false
        });
      } else if (isSupportedImageSrc(ih.videoSrc)) {
        showFullscreenImage(ih.videoSrc, {
          zoomStartScale: ih.stillZoomStartScale || ih.videoStillZoomStartScale || 2.7,
          zoomOrigin: ih.stillZoomOrigin || ih.videoStillZoomOrigin || '32% 45%',
          durationMs: ih.stillDurationMs || ih.videoImageDurationMs || ih.videoStillDurationMs || 6800,
          endHoldMs: ih.stillEndHoldMs || ih.videoStillEndHoldMs || 500,
          manualEnd: true,
          onEnd: finishPortalVideo
        });
      } else {
        showFullscreenVideo(ih.videoSrc, {
          loop: ih.videoLoop === true,
          manualEnd: true,
          onEnd: function() {
            // 動画終了 → 先に pano の向き/遷移を確定 → その後に overlay を閉じる
            finishPortalVideo();
          }
        });
      }
    }, 520);
    return;
  }

  var vid = hs.linkedVideo;
  if (!vid) {
    vid = document.createElement('video');
    vid.className = 'portal-linked-video';
    vid.src = ih.videoSrc;
    vid.playsInline = true;
    vid.muted = false;
    vid.loop = ih.videoLoop === true;
    vid.preload = 'auto';
    hs.inner.appendChild(vid);
    hs.linkedVideo = vid;
  }
  setTimeout(function() {
    if (!hs.linkedVideo) return;
    hs.linkedVideo.classList.add('is-playing');
    hs.linkedVideo.play().catch(function() {
      hs.linkedVideo.muted = true;
      hs.linkedVideo.play();
    });
  }, 400);
  vid.onended = function() {
    if (ih.videoLoop === true) return;
    finishPortalVideo();
  };
}

function guideCoordsToScreenApprox(yaw, pitch) {
  var view = currentScene && currentScene.view && currentScene.view();
  if (!view) return null;
  try {
    if (typeof view.coordinatesToScreen === 'function') {
      var scr = view.coordinatesToScreen({ yaw: yaw, pitch: pitch });
      if (scr && isFinite(scr.x) && isFinite(scr.y)) return scr;
    }
  } catch (e0) {}
  var p = view.parameters();
  if (!p) return null;
  var dy = yaw - p.yaw;
  while (dy > Math.PI) dy -= 2 * Math.PI;
  while (dy < -Math.PI) dy += 2 * Math.PI;
  var dp = pitch - p.pitch;
  var fov = p.fov || 1.2;
  if (Math.abs(dy) > fov * 0.62 || Math.abs(dp) > fov * 0.55) return null;
  var panoW = panoElement.clientWidth || window.innerWidth;
  var panoH = panoElement.clientHeight || window.innerHeight;
  return {
    x: panoW * (0.5 + dy / fov),
    y: panoH * (0.5 + dp / fov)
  };
}

/** iPad 画面固定オーバーレイ: data.js の width/height に比例（旧 42% 上限は大きさ変更が効かなくなる） */
function computeGuideIosOverlayDrawSize(dataW, dataH, panoW, panoH) {
  var w = Math.max(200, parseInt(dataW, 10) || 280);
  var h = Math.max(260, parseInt(dataH, 10) || 380);
  var pw = Math.max(320, panoW || window.innerWidth || 320);
  var ph = Math.max(240, panoH || window.innerHeight || 240);
  var REF_DATA_W = 280;
  var baseFrac = 0.28;
  var drawW = Math.round(pw * baseFrac * (w / REF_DATA_W));
  var drawH = Math.round(drawW * (h / w));
  var capW = Math.round(pw * 0.92);
  var capH = Math.round(ph * 0.88);
  if (drawW > capW) {
    var s = capW / drawW;
    drawW = capW;
    drawH = Math.round(drawH * s);
  }
  if (drawH > capH) {
    var s2 = capH / drawH;
    drawH = capH;
    drawW = Math.round(drawW * s2);
  }
  return {
    drawW: Math.max(80, drawW),
    drawH: Math.max(100, drawH)
  };
}

function updateAllGuideIosOverlays() {
  if (!guideDeviceIsIosSafari()) return;
  var curId = currentSceneObj && currentSceneObj.data ? currentSceneObj.data.id : null;

  (window.sceneVideoEls || []).forEach(function(entry) {

      entry.iosOverlayEl.style.display = 'none';
      return;
    }
    var scr = guideCoordsToScreenApprox(entry.placeYaw, entry.placePitch);
    var el = entry.iosOverlayEl;
    var panoW = panoRect.width || panoElement.clientWidth || window.innerWidth;
    var panoH = panoRect.height || panoElement.clientHeight || window.innerHeight;
    if (!scr) {
      scr = { x: panoW * 0.58, y: panoH * 0.28 };
    }
    var sized = computeGuideIosOverlayDrawSize(entry.overlayW, entry.overlayH, panoW, panoH);
    var drawW = sized.drawW;
    var drawH = sized.drawH;
    el.style.display = 'block';
    el.style.position = 'absolute';
    el.style.left = (scr.x - drawW * 0.5) + 'px';
    el.style.top = (scr.y - drawH * 0.5) + 'px';
    el.style.width = drawW + 'px';
    el.style.height = drawH + 'px';
    entry.overlayDrawW = drawW;
    entry.overlayDrawH = drawH;
  });
}

function findSideRouteChainSceneId(chainDelta) {
  if (!currentSceneObj) return null;
  var currentCourse = sceneCourseKey(currentSceneObj.data);
  var currentPos = Number(inferScenePosition(currentSceneObj.data));
  var nextPos = currentPos + chainDelta;
  if (!Number.isFinite(nextPos)) return null;

  if (currentCourse === 'cc' && CC_CHAIN_SCENE_IDS[nextPos]) {
    return CC_CHAIN_SCENE_IDS[nextPos];
  }

  for (var fid in scenesData) {
    var sd = scenesData[fid].data;
    if (Number(inferScenePosition(sd)) === nextPos && sceneCourseKey(sd) === currentCourse) {
      return fid;
    }
  }
  return null;
}

function videoHotspotPerspectiveRadius(vh, w, h) {
  var r;
  if (vh.radius !== undefined && vh.radius !== null && vh.radius !== '' && Number(vh.radius) !== 1100) {
    r = Number(vh.radius);
  } else {
    r = 850;
  }
  // ポータル(imageHotspots)は radius≈800。動画も同程度に近づける（大きいほど奥＝小さく見える）
  return Math.max(720, Math.min(1200, r));
}

function videoHotspotSrcUrl(rawSrc) {
  var src = rawSrc || '';
  if (!src) return src;
  if (src.indexOf('?') < 0) src += '?v=' + encodeURIComponent(BUILD_STAMP);
  else src += '&v=' + encodeURIComponent(BUILD_STAMP);
  return src;
}

/** WebM の透過は Chrome 向け。iPad/Safari は HEVC（hvc1）が必須。 */
function guideIosMp4Src(vh) {
  if (vh && vh.srcIos) return vh.srcIos;
  var s = (vh && vh.src) || '';
  if (/\.webm$/i.test(s)) return s.replace(/\.webm$/i, '_ios.mp4');
  if (/\.(mp4|m4v)$/i.test(s)) return s;
  return s.replace(/(\.[^./]+)$/, '_ios.mp4');
}

function guideVideoHevcSrc(webmSrc, vh) {
  if (vh && vh.srcHevc) return vh.srcHevc;
  var s = webmSrc || '';
  if (!s) return '';
  if (/\.webm$/i.test(s)) return s.replace(/\.webm$/i, '_hevc.mov');
  if (/\.(mp4|m4v)$/i.test(s)) return s.replace(/\.(mp4|m4v)$/i, '_hevc.mov');
  return s.replace(/(\.[^./]+)$/, '_hevc.mov');
}

function appendGuideVideoSources(vid, vh) {
  if (!vid || !vh || !vh.src) return;
  while (vid.firstChild) vid.removeChild(vid.firstChild);
  vid.removeAttribute('src');
  var webmUrl = videoHotspotSrcUrl(vh.src);
  if (guideDeviceIsIosSafari()) {
    var mp4Path = guideIosMp4Src(vh);
    vid.src = mp4Path ? videoHotspotSrcUrl(mp4Path) : webmUrl;
    return;
  }
  /* 無い HEVC を先に読むと WebM に落ちないことがあるため WebM のみ（iPad は上で return） */
  if (!guideDeviceIsIosSafari()) {
    var hevc = guideVideoHevcSrc(vh.src, vh);
    if (hevc) {
      var sHevc = document.createElement('source');
      sHevc.src = videoHotspotSrcUrl(hevc);
      sHevc.type = 'video/mp4; codecs="hvc1"';
      vid.appendChild(sHevc);
    }
  }
  var sWebm = document.createElement('source');
  sWebm.src = webmUrl;
  if (/\.webm$/i.test(vh.src)) sWebm.type = 'video/webm; codecs="vp9"';
  else if (/\.(mp4|m4v)$/i.test(vh.src)) sWebm.type = 'video/mp4';
  else sWebm.type = 'video/webm';
  vid.appendChild(sWebm);
}

function preloadGuideVideos() {
  if (!data || !data.scenes) return;
  data.scenes.forEach(function(sd) {
    if (!sd.videoHotspots) return;
    sd.videoHotspots.forEach(function(vh) {
      if (!vh.src || guideVideoPreloadBySrc[vh.src]) return;
      var v = document.createElement('video');
      v.muted = true;
      v.preload = 'auto';
      v.playsInline = true;
      v.setAttribute('playsinline', '');
      v.setAttribute('aria-hidden', 'true');
      v.style.cssText = 'position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;left:-9999px;top:0';
      appendGuideVideoSources(v, vh);
      document.body.appendChild(v);
      try { v.load(); } catch (e) {}
      guideVideoPreloadBySrc[vh.src] = v;
    });
  });
}

function isGuideVideoPreloaded(rawSrc) {
  var p = guideVideoPreloadBySrc[rawSrc];
  return !!(p && p.readyState >= 2);
}

function seekGuideVideoToLastFrame(vid) {
  function seek() {
    try {
      if (vid.readyState >= 1 && isFinite(vid.duration) && vid.duration > 0) {
        vid.currentTime = Math.max(0, vid.duration - 0.05);
      }
      vid.pause();
    } catch (e) {}
  }
  if (vid.readyState >= 1) seek();
  else vid.addEventListener('loadedmetadata', seek, { once: true });
}

function setupGuideVideoPlayback(vid, vh, sceneId, entry) {
  var loop = vh.loop === true;
  entry.guidePlaybackDone = !loop && guideVideoSessionDone[sceneId] === true;

  if (entry.guidePlaybackDone) {
    seekGuideVideoToLastFrame(vid);
    vid.addEventListener('loadeddata', function() {
      seekGuideVideoToLastFrame(vid);
      paintGuideCanvasOnce(entry);
    }, { once: true });
    return;
  }

  var started = false;
  function tryPlayOnce() {
